  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0c0e;

  html, body {

  #app {

  #panel-footer {

  .footer-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Result overlay */
  #result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px);

  }

  #result-overlay.show { display: flex; }

  #result-card {
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 24px;
    padding: 48px 64px;
    text-align: center;
    box-shadow: 0 0 80px rgba(240,192,96,0.2);
    animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }

  }

  #result-label {
    font-size: 12px;

  }

  #result-name {

  #result-close {
    background: var(--accent);

  /* Confetti dots */
  .confetti-piece {

  @keyframes confettiFall {

  /* Empty state */

  /* Responsive */

    #wheel-canvas { width: 300px; height: 300px; }

<body>

<div id="app">
  <div id="wheel-side">
    <div id="wheel-title">Wheel of Names</div>
    <div id="wheel-wrap">
      <canvas id="wheel-canvas" width="840" height="840"></canvas>
      <div id="pointer"></div>
      <div id="hub">🎯</div>
    </div>
    <button id="spin-btn">Spin</button>
  </div>

  <div id="panel">
    <div id="panel-header">
      <span id="panel-title">Names</span>
      <span id="count-badge">0</span>
    </div>
    <div id="input-row">
      <input id="name-input" type="text" placeholder="Add a name…" maxlength="40" autocomplete="off">
      <button id="add-btn">+</button>
    </div>
    <div id="names-list">
      <div id="empty-hint">Add names above<br>then spin the wheel!</div>
    </div>
    <div id="panel-footer">
      <button class="footer-btn" id="shuffle-btn">⇄ Shuffle</button>
      <button class="footer-btn" id="clear-btn">✕ Clear all</button>
    </div>
  </div>
</div>

<div id="result-overlay">
  <div id="result-card">
    <div id="result-label">🎉 Winner!</div>
    <div id="result-name"></div>
  </div>
  <button id="result-close">Continue</button>
</div>

<script>
// ── Crypto-based random ──────────────────────────────────────
function cryptoRandom() {
  const buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  return buf[0] / (0xFFFFFFFF + 1);
}

function cryptoInt(min, max) {
  return Math.floor(cryptoRandom() * (max - min + 1)) + min;
}

// ── State ────────────────────────────────────────────────────
let names = ['Alice', 'Bob', 'Charlie', 'Diana', 'Ethan', 'Fiona'];
let currentAngle = 0;
let isSpinning = false;

// Segment palette — rich, distinct colours
const PALETTE = [
  '#e85d75','#f0a050','#f0c060','#6dd4a8',
  '#5bc4e8','#7b8cf8','#c47bdb','#e87b5d',
  '#80d46d','#f06890','#50c8d0','#d4a06d',
  '#8888ee','#e8c050','#60d888','#d06898'
];

function colorAt(i) {
  return PALETTE[i % PALETTE.length];
}

// ── Canvas ───────────────────────────────────────────────────
const canvas = document.getElementById('wheel-canvas');
const ctx = canvas.getContext('2d');
const CX = canvas.width / 2;
const CY = canvas.height / 2;
const R = CX - 10;

function drawWheel(angle) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (names.length === 0) {
    // Empty wheel
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.fillStyle = '#1a1a28';
    ctx.fill();
    ctx.strokeStyle = '#2a2a40';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = '#555570';
    ctx.font = '500 28px DM Sans';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Add names →', CX, CY);
    return;
  }

  const n = names.length;
  const arc = (Math.PI * 2) / n;

  for (let i = 0; i < n; i++) {
    const startA = angle + i * arc;
    const endA = startA + arc;
    const midA = startA + arc / 2;

    // Segment fill
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, startA, endA);
    ctx.closePath();
    ctx.fillStyle = colorAt(i);
    ctx.fill();

    // Subtle darker border
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(midA);

    const textR = R * 0.62;
    const maxW = R * 0.55;

    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.font = `600 ${fontSize(n)}px DM Sans`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    let label = names[i];
    // Truncate if too long
    while (ctx.measureText(label).width > maxW && label.length > 2) {
      label = label.slice(0, -2) + '…';
    }

    // Shadow text
    ctx.fillText(label, textR + 1, 1);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(label, textR, 0);
    ctx.restore();
  }

  // Outer ring
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 4;
  ctx.stroke();
}

function fontSize(n) {
  if (n <= 4) return 32;
  if (n <= 8) return 26;
  if (n <= 12) return 22;
  if (n <= 20) return 18;
  return 14;
}

// ── Spin logic ───────────────────────────────────────────────
function spin() {
  if (isSpinning || names.length < 2) return;
  isSpinning = true;
  document.getElementById('spin-btn').disabled = true;

  const n = names.length;
  const arc = (Math.PI * 2) / n;

  // Pick winner using crypto
  const winnerIdx = cryptoInt(0, n - 1);

  // We need the wheel to stop so the pointer (at right = 0 rad) points at winner
  // Pointer is at angle 0 (right side). Segment i starts at: currentAngle + i*arc
  // Mid of segment i: currentAngle + i*arc + arc/2
  // We want mid of winner at 0 (or 2π) after spin
  // Extra full rotations: 5–10 spins for drama
  const extraSpins = cryptoInt(6, 10) * Math.PI * 2;
  const targetMid = winnerIdx * arc + arc / 2;
  // Target final angle: offset so winner mid lands at 0
  const targetAngle = extraSpins - targetMid;

  const startAngle = currentAngle;
  const totalDelta = targetAngle - (startAngle % (Math.PI * 2));
  const duration = 4000 + cryptoInt(0, 1200);
  let startTime = null;

  function easeOut(t) {
    // Cubic ease out for smooth deceleration
    return 1 - Math.pow(1 - t, 4);
  }

  function frame(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;
    const t = Math.min(elapsed / duration, 1);
    const eased = easeOut(t);

    currentAngle = startAngle + totalDelta * eased;
    drawWheel(currentAngle);

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      currentAngle = targetAngle % (Math.PI * 2);
      isSpinning = false;
      document.getElementById('spin-btn').disabled = false;
      showResult(names[winnerIdx], colorAt(winnerIdx));
    }
  }

  requestAnimationFrame(frame);
}

// ── Result overlay ───────────────────────────────────────────
function showResult(name, color) {
  document.getElementById('result-name').textContent = name;
  document.getElementById('result-name').style.color = color;
  document.getElementById('result-overlay').classList.add('show');
  launchConfetti(color);
}

function hideResult() {
  document.getElementById('result-overlay').classList.remove('show');
}

function launchConfetti(winColor) {
  const colors = [winColor, '#f0c060', '#a78bfa', '#fff', '#f87171', '#60d888'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = cryptoRandom() * 100 + 'vw';
    el.style.top = '-20px';
    el.style.background = colors[cryptoInt(0, colors.length - 1)];
    el.style.width = cryptoInt(6, 12) + 'px';
    el.style.height = cryptoInt(6, 14) + 'px';
    el.style.borderRadius = cryptoRandom() > 0.5 ? '50%' : '2px';
    const dur = cryptoInt(1800, 3200);
    el.style.animationDuration = dur + 'ms';
    el.style.animationDelay = cryptoInt(0, 600) + 'ms';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), dur + 800);
  }
}

// ── Names list UI ────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('names-list');
  const badge = document.getElementById('count-badge');
  badge.textContent = names.length;

  if (names.length === 0) {
    list.innerHTML = '<div id="empty-hint">Add names above<br>then spin the wheel!</div>';
    return;
  }

  list.innerHTML = '';
  names.forEach((name, i) => {
    const item = document.createElement('div');
    item.className = 'name-item';
    item.innerHTML = `
      <div class="name-dot" style="background:${colorAt(i)}"></div>
      <span class="name-text">${escHtml(name)}</span>
      <button class="remove-btn" data-i="${i}" title="Remove">×</button>
    `;
    list.appendChild(item);
  });

  list.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      names.splice(parseInt(btn.dataset.i), 1);
      renderAll();
    });
  });
}

function renderAll() {
  renderList();
  drawWheel(currentAngle);
  document.getElementById('spin-btn').disabled = names.length < 2;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Add name ─────────────────────────────────────────────────
function addName() {
  const input = document.getElementById('name-input');
  const val = input.value.trim();
  if (!val) return;
  names.push(val);
  input.value = '';
  input.focus();
  renderAll();
}

document.getElementById('add-btn').addEventListener('click', addName);
document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addName();
});

// ── Spin button ───────────────────────────────────────────────
document.getElementById('spin-btn').addEventListener('click', spin);

// ── Footer controls ──────────────────────────────────────────
document.getElementById('clear-btn').addEventListener('click', () => {
  if (names.length === 0) return;
  if (confirm('Clear all names?')) { names = []; renderAll(); }
});

document.getElementById('shuffle-btn').addEventListener('click', () => {
  // Fisher-Yates with crypto random
  for (let i = names.length - 1; i > 0; i--) {
    const j = cryptoInt(0, i);
    [names[i], names[j]] = [names[j], names[i]];
  }
  renderAll();
});

// ── Result close ─────────────────────────────────────────────
document.getElementById('result-close').addEventListener('click', hideResult);
document.getElementById('result-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('result-overlay')) hideResult();
});

// ── Init ─────────────────────────────────────────────────────
renderAll();
</script>
